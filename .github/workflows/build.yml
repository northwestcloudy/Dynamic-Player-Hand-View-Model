name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build
        run: ./gradlew clean buildAllPlatforms --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dynamic-player-model-26.2-all-loaders
          path: |
            build/libs/dynamic-player-model-*.jar
            forge/build/libs/dynamic-player-model-*.jar
            neoforge/build/libs/dynamic-player-model-*.jar
          if-no-files-found: error
