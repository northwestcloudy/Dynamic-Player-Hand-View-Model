plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

def projectDescription = project.mod_description.toString()
def resolvedModVersion = version.toString()
def resolvedArchivesBaseName = project.archives_base_name.toString()
def fabricMetadata = [
	version: resolvedModVersion,
	mod_id: project.mod_id,
	mod_name: project.mod_name,
	mod_description: project.mod_description,
	mod_authors: project.mod_authors,
	mod_license: project.mod_license,
	minecraft_version: project.minecraft_version,
	loader_version: project.loader_version,
	fabric_api_version: project.fabric_api_version
]

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
}

loom {
	mods {
		"dynamic_player_model" {
			sourceSet sourceSets.main
		}
	}
}

tasks.named('jar', Jar) {
	archiveClassifier = 'fabric'
}

tasks.register('buildAllPlatforms') {
	group = 'build'
	description = 'Builds the Fabric, Forge, and NeoForge client jars.'
	dependsOn 'build', ':forge:build', ':neoforge:build'
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	runtimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.properties fabricMetadata

	filesMatching("fabric.mod.json") {
		expand fabricMetadata
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	withSourcesJar()
}

tasks.named('sourcesJar', Jar) {
	archiveClassifier = 'fabric-sources'
}

tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

tasks.withType(Jar).configureEach {
	from("LICENSE") {
		into("META-INF")
		rename { "${it}_${resolvedArchivesBaseName}" }
	}
	from("THIRD_PARTY_NOTICES.md") {
		into("META-INF")
		rename { "THIRD_PARTY_NOTICES_${resolvedArchivesBaseName}.md" }
	}
	from("LICENSES") {
		into("META-INF/licenses")
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java

			pom {
				name = project.mod_name
				description = projectDescription
				licenses {
					license {
						name = "MIT License"
						url = "https://spdx.org/licenses/MIT.html"
						distribution = "repo"
					}
				}
			}
		}
	}
}
